[project]
name = "ssr"
version = "0.1.0"
description = "SSR: sparse semantic retrieval — training and evaluation"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pylate>=1.5.0",
    "datasets>=2.20.0",
    "accelerate>=0.31.0",
    "safetensors>=0.4.0",
    "wandb>=0.18.0",
    "sentence-transformers==5.3.0",
    "transformers>=4.41.0,<=5.3.0",
]

[project.optional-dependencies]
eval = [
    "numba>=0.60.0",
]
data = [
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "tqdm>=4.66.0",
    "mteb>=2.0.0",
]

[tool.uv]
# CUDA 12.8: install PyTorch from cu128 index to avoid cu130 driver errors
torch-backend = "cu128"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssr"]
